{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "import-products.fullname" . }}-cron
  labels:
    {{- include "import-products.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "import-products.labels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: {{ include "import-products.serviceAccountName" . }}
          restartPolicy: Never
          containers:
            - name: kubectl-exec
              image: {{ .Values.cronjob.image | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  PODS=$(kubectl get pods \
                    -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=app \
                    -o jsonpath='{.items[*].metadata.name}' \
                    -n {{ .Release.Namespace }})
                  for POD in $PODS; do
                    echo "Running cron.py in $POD"
                    kubectl exec -n {{ .Release.Namespace }} "$POD" -- /bin/sh -c '
                      cd /app/backend
                      export UPLOAD_DIR=uploads
                      python3 -m src.cron
                      if [ "$?" = "0" ]; then
                        echo "Path $UPLOAD_DIR is cleaned !!"
                      fi
                    '
                  done
{{- end }}
