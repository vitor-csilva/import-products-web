{{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "import-products.secretName" . }}
  labels:
    {{- include "import-products.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_HOST: {{ include "import-products.database.host" . | quote }}
  DATABASE_USER: {{ .Values.database.auth.username | quote }}
  DATABASE_PASS: {{ .Values.database.auth.password | quote }}
  DATABASE_DBNAME: {{ .Values.database.auth.database | quote }}
{{- end }}
