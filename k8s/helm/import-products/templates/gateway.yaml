apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "import-products.fullname" . }}-route
  namespace: {{ .Release.Namespace }} # Should match your service namespace
spec:
  parentRefs:
  - name: apps
    namespace: envoy-gateway-system
  hostnames:
  - "import-products.demo.com"
  rules:
  # 1. Backend API Rule with Rewrite
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: / # This replaces the Nginx rewrite-target logic
    backendRefs:
    - name: import-products
      port: 81

  # 2. Frontend Rule
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: import-products
      port: 80