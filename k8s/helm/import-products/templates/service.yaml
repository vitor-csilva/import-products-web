apiVersion: v1
kind: Service
metadata:
  name: {{ include "import-products.fullname" . }}
  labels:
    {{- include "import-products.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: frontend
      port: {{ .Values.service.frontend.port }}
      protocol: TCP
      targetPort: {{ .Values.service.frontend.targetPort }}
    - name: backend
      port: {{ .Values.service.backend.port }}
      protocol: TCP
      targetPort: {{ .Values.service.backend.targetPort }}
  selector:
    {{- include "import-products.selectorLabels" . | nindent 4 }}
